name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    name: HACS Validation
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    name: Hassfest Validation
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tests stub the Home Assistant and bleak surfaces themselves, so they
      # need no dependencies. Each file is a standalone unittest module.
      - name: Run tests
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"
            python3 "$f" || exit 1
            echo "::endgroup::"
          done
